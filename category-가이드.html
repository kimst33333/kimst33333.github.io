    <a id="cookie-consent-manage" href="privacy.html">옵션 관리</a>
  </div>
</div>
<script>
(function () {
  var KEY = "adConsent";
  var el = document.getElementById("cookie-consent");
  if (!el) return;
  if (!localStorage.getItem(KEY)) { el.hidden = false; }
  document.getElementById("cookie-consent-accept").addEventListener("click", function () {
    localStorage.setItem(KEY, "granted");
    window.adsbygoogle = window.adsbygoogle || [];
    window.adsbygoogle.requestNonPersonalizedAds = 0;
    el.hidden = true;
  });
  document.getElementById("cookie-consent-reject").addEventListener("click", function () {
    localStorage.setItem(KEY, "denied");
    window.adsbygoogle = window.adsbygoogle || [];
    window.adsbygoogle.requestNonPersonalizedAds = 1;
    el.hidden = true;
  });
})();

(function () {
  // 글자 크기 조절: 0(기본)~3단계, localStorage에 저장해서 페이지 이동해도 유지
  var KEY = "fontSizeStep";
  var MAX = 3;
  var root = document.documentElement;
  function apply(step) {
    root.style.fontSize = (100 + step * 12) + "%";
  }
  var step = parseInt(localStorage.getItem(KEY) || "0", 10);
  apply(step);
  document.getElementById("font-size-up").addEventListener("click", function () {
    step = Math.min(MAX, step + 1);
    localStorage.setItem(KEY, step);
    apply(step);
  });
  document.getElementById("font-size-down").addEventListener("click", function () {
    step = Math.max(0, step - 1);
    localStorage.setItem(KEY, step);
    apply(step);
  });
})();

(function () {
  // 맨 위로 가기: 일정 스크롤 이상 내려가면 나타남
  var btn = document.getElementById("back-to-top");
  window.addEventListener("scroll", function () {
    btn.hidden = window.scrollY < 400;
  });
  btn.addEventListener("click", function () {
    window.scrollTo({top: 0, behavior: "smooth"});
  });
})();
</script>
